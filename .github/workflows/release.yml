name: Build and release binaries

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  linux-x86_64:
    name: Linux x86_64 AppImage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Foreseer Desktop
        uses: actions/checkout@v4
        with:
          path: foreseer-desktop
          fetch-depth: 0

      - name: Read pinned Foreseerr revision
        id: foreseerr
        shell: bash
        run: |
          revision="$(tr -d '[:space:]' < foreseer-desktop/foreseerr.rev)"
          test -n "${revision}"
          echo "revision=${revision}" >> "${GITHUB_OUTPUT}"

      - name: Checkout pinned Foreseerr
        uses: actions/checkout@v4
        with:
          repository: selmant/foreseerr
          ref: ${{ steps.foreseerr.outputs.revision }}
          path: SeerrSuggestArr
          submodules: recursive

      - name: Install pinned Node
        uses: actions/setup-node@v4
        with:
          node-version-file: foreseer-desktop/node.rev

      - name: Validate release pins
        working-directory: foreseer-desktop
        shell: bash
        env:
          FORESEERR_DIR: ${{ github.workspace }}/SeerrSuggestArr
        run: ./scripts/check-release-pins.sh

      - name: Read pinned Jellium revision
        id: jellium
        shell: bash
        run: |
          revision="$(tr -d '[:space:]' < foreseer-desktop/jellium.rev)"
          test -n "${revision}"
          echo "revision=${revision}" >> "${GITHUB_OUTPUT}"

      - name: Checkout pinned Jellium
        uses: actions/checkout@v4
        with:
          repository: selmant/jellium-desktop
          ref: ${{ steps.jellium.outputs.revision }}
          path: jellium-desktop
          submodules: recursive

      - name: Audit pinned runtime boundary and protocol contracts
        working-directory: foreseer-desktop
        shell: bash
        env:
          JELLIUM_DIR: ${{ github.workspace }}/jellium-desktop
          FORESEERR_DIR: ${{ github.workspace }}/SeerrSuggestArr
        run: |
          set -euo pipefail
          ./scripts/boundary-audit.sh
          node -e '
            const fs = require("fs");
            const a = JSON.parse(fs.readFileSync(process.env.FORESEERR_DIR + "/protocol/protocol-v1.json"));
            const b = JSON.parse(fs.readFileSync("protocol/protocol-v1.json"));
            if (JSON.stringify(a) !== JSON.stringify(b)) throw new Error("Foreseerr protocol fixture differs from desktop fixture");
          '
          grep -q 'FORESEERR_DESKTOP_READY' "$FORESEERR_DIR/server/index.ts"
          grep -q 'protocolVersion: 1' "$FORESEERR_DIR/server/index.ts"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache CEF
        uses: actions/cache@v4
        with:
          path: jellium-desktop/.cache/cef
          key: cef-linux-x86_64-${{ hashFiles('jellium-desktop/src/Cargo.lock') }}

      - name: Fetch CEF
        working-directory: jellium-desktop
        shell: bash
        run: cargo xtask fetch-cef

      - name: Determine version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$(sed -nE 's/^version = "([^"]+)"/\1/p' foreseer-desktop/Cargo.toml | head -n1)"
          fi
          test -n "${version}"
          manifest_version="$(sed -nE 's/^version = "([^"]+)"/\1/p' foreseer-desktop/Cargo.toml | head -n1)"
          test "${version}" = "${manifest_version}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      # The Jellium AppImage builder already knows how to bundle CEF, mpv,
      # glibc, PipeWire and the remaining runtime libraries. This temporary
      # checkout-only adaptation makes it build Foreseer after staging those
      # dependencies. Nothing is committed back to the Jellium repository.
      - name: Prepare Foreseer AppImage builder
        shell: bash
        run: |
          set -euo pipefail

          script="jellium-desktop/dev/linux/appimage/container-build.sh"
          app_run="jellium-desktop/dev/linux/appimage/AppRun"
          resources="jellium-desktop/resources/linux"

          awk '
            $0 == "cd /src" {
              print "cd /workspace/jellium-desktop"
              next
            }
            $0 == "cargo xtask build --out /build" {
              print
              print "cd /workspace/foreseer-desktop"
              print "env CEF_PATH=/workspace/jellium-desktop/.cache/cef JFN_MPV_INCLUDE_DIR=/workspace/jellium-desktop/third_party/mpv/include JFN_MPV_LIB_DIR=/build/mpv-build CARGO_TARGET_DIR=/build/foreseer-target cargo build --release"
              print "cp /build/foreseer-target/release/foreseer-desktop /build/foreseer-desktop"
              print "cd /workspace/jellium-desktop"
              next
            }
            $0 == "# Desktop integration" {
              print "# Bundled Foreseerr + Node runtime (resolved relative to the executable)."
              print "mkdir -p \"$APPDIR/usr/bin/resources\""
              print "cp -a /workspace/foreseer-desktop/resources/. \"$APPDIR/usr/bin/resources/\""
              print
            }
            {
              # POSIX awk replacement strings do not support capture-group
              # backreferences. Every Jellium executable-name occurrence in
              # this copied AppImage script must become the Foreseer name.
              gsub(/jellium-desktop/, "foreseer-desktop")
              gsub(/\/src\//, "/workspace/jellium-desktop/")
              gsub(/net\.nullsum\.JelliumDesktop/, "com.selmantrabzon.Foreseer")
              gsub(/JelliumDesktop/, "ForeseerDesktop")
              print
            }
          ' "${script}" > "${script}.tmp"
          mv "${script}.tmp" "${script}"
          chmod +x "${script}"

          sed -i 's/jellium-desktop/foreseer-desktop/g' "${app_run}"

          mv "${resources}/net.nullsum.JelliumDesktop.desktop" \
             "${resources}/com.selmantrabzon.Foreseer.desktop"
          mv "${resources}/net.nullsum.JelliumDesktop.svg" \
             "${resources}/com.selmantrabzon.Foreseer.svg"
          mv "${resources}/net.nullsum.JelliumDesktop.metainfo.xml" \
             "${resources}/com.selmantrabzon.Foreseer.metainfo.xml"

          sed -i \
            -e 's/net\.nullsum\.JelliumDesktop/com.selmantrabzon.Foreseer/g' \
            -e 's/Name=Jellium Desktop/Name=Foreseer Desktop/' \
            -e 's/Comment=Desktop client for Jellyfin/Comment=Native desktop client for Foreseer/' \
            -e 's/Exec=jellium-desktop/Exec=foreseer-desktop/' \
            "${resources}/com.selmantrabzon.Foreseer.desktop"

          sed -i \
            -e 's/net\.nullsum\.JelliumDesktop/com.selmantrabzon.Foreseer/g' \
            -e 's/Jellium Desktop/Foreseer Desktop/g' \
            -e 's/Jellyfin media client for desktop/Native desktop client for Foreseer/' \
            -e 's#https://github.com/andrewrabert/jellium-desktop/issues#https://github.com/selmant/foreseer-desktop/issues#' \
            -e 's#https://jellyfin.org/docs/#https://github.com/selmant/foreseer-desktop#' \
            -e 's#https://jellyfin.org#https://foreseer.example.com#' \
            -e 's/GPL-2.0-or-later/GPL-2.0-only/' \
            "${resources}/com.selmantrabzon.Foreseer.metainfo.xml"

          grep -q 'cargo build --release' "${script}"
          grep -q 'foreseer-desktop' "${app_run}"

      - name: Build AppImage container
        shell: bash
        run: |
          docker build \
            --tag foreseer-desktop-appimage:ci \
            --file jellium-desktop/dev/linux/appimage/Dockerfile \
            jellium-desktop/dev/linux/appimage

      - name: Build Linux AppImage
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p .build/appimage dist

          docker run --rm \
            --env FORESEERR_DIR=/workspace/SeerrSuggestArr \
            --env FORESEERR_NODE_BIN=/opt/foreseer-node/bin/node \
            --env VERSION="${VERSION}" \
            --volume "${GITHUB_WORKSPACE}:/workspace" \
            --volume "${GITHUB_WORKSPACE}/.build/appimage:/build" \
            --volume "${GITHUB_WORKSPACE}/dist:/host-output" \
            foreseer-desktop-appimage:ci \
            sh -ec '
              set -eu
              node_version="$(tr -d "[:space:]" < /workspace/foreseer-desktop/node.rev)"
              architecture="$(uname -m)"
              case "$architecture" in
                x86_64) node_arch=x64 ;;
                aarch64) node_arch=arm64 ;;
                *) echo "unsupported Node architecture: $architecture" >&2; exit 1 ;;
              esac
              wget -q -O /tmp/node.tar.xz "https://nodejs.org/dist/$node_version/node-$node_version-linux-$node_arch.tar.xz"
              mkdir -p /opt/foreseer-node
              tar -xJf /tmp/node.tar.xz --strip-components=1 -C /opt/foreseer-node
              corepack enable
              corepack prepare pnpm@10.24.0 --activate
              /workspace/foreseer-desktop/scripts/stage-foreseerr.sh /workspace/foreseer-desktop/resources
              /workspace/jellium-desktop/dev/linux/appimage/container-build.sh
            '

          sudo chown -R "$(id -u):$(id -g)" dist .build jellium-desktop/.cache || true
          test -f "dist/ForeseerDesktop-${VERSION}-x86_64.AppImage"
          chmod +x "dist/ForeseerDesktop-${VERSION}-x86_64.AppImage"

      - name: Verify Linux runtime payload
        shell: bash
        run: |
          set -euo pipefail
          test -f foreseer-desktop/resources/foreseerr/launcher.js
          test -x foreseer-desktop/resources/node/node
          test -f foreseer-desktop/resources/THIRD_PARTY_NOTICES.txt
          strings "dist/ForeseerDesktop-${{ steps.version.outputs.version }}-x86_64.AppImage" | grep -q 'foreseerr/launcher.js'

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: foreseer-desktop-linux-x86_64
          path: dist/ForeseerDesktop-*.AppImage
          if-no-files-found: error

  windows-x64:
    name: Windows x64 portable ZIP
    runs-on: windows-latest

    steps:
      - name: Checkout Foreseer Desktop
        uses: actions/checkout@v4
        with:
          path: foreseer-desktop
          fetch-depth: 0

      - name: Read pinned Foreseerr revision
        id: foreseerr
        shell: pwsh
        run: |
          $revision = (Get-Content foreseer-desktop/foreseerr.rev -Raw).Trim()
          if (-not $revision) { throw "foreseerr.rev is empty" }
          "revision=$revision" >> $env:GITHUB_OUTPUT

      - name: Checkout pinned Foreseerr
        uses: actions/checkout@v4
        with:
          repository: selmant/foreseerr
          ref: ${{ steps.foreseerr.outputs.revision }}
          path: SeerrSuggestArr
          submodules: recursive

      - name: Install pinned Node
        uses: actions/setup-node@v4
        with:
          node-version-file: foreseer-desktop/node.rev

      - name: Stage bundled Foreseerr runtime
        shell: pwsh
        env:
          FORESEERR_DIR: ${{ github.workspace }}\SeerrSuggestArr
        run: |
          corepack enable
          corepack prepare pnpm@10.24.0 --activate
          $bash = Join-Path $env:ProgramFiles 'Git\bin\bash.exe'
          if (-not (Test-Path $bash)) { throw "Git Bash is required to stage the runtime" }
          & $bash -lc 'cd "$(cygpath -u "$GITHUB_WORKSPACE")"; export FORESEERR_DIR="$(cygpath -u "$FORESEERR_DIR")"; ./foreseer-desktop/scripts/stage-foreseerr.sh ./bundle/resources'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path bundle/resources/foreseerr/launcher.js)) { throw "Foreseerr runtime was not staged" }
          if (-not (Test-Path bundle/resources/node/node.exe)) { throw "Node runtime was not staged" }

      - name: Read pinned Jellium revision
        id: jellium
        shell: pwsh
        run: |
          $revision = (Get-Content foreseer-desktop/jellium.rev -Raw).Trim()
          if (-not $revision) {
            throw "jellium.rev is empty"
          }
          "revision=$revision" >> $env:GITHUB_OUTPUT

      - name: Checkout pinned Jellium
        uses: actions/checkout@v4
        with:
          repository: selmant/jellium-desktop
          ref: ${{ steps.jellium.outputs.revision }}
          path: jellium-desktop
          submodules: recursive

      - name: Audit pinned runtime boundary and protocol contracts
        shell: pwsh
        run: |
          $bash = Join-Path $env:ProgramFiles 'Git\bin\bash.exe'
          if (-not (Test-Path $bash)) { throw "Git Bash is required for the boundary audit" }
          & $bash -lc 'cd "$(cygpath -u "$GITHUB_WORKSPACE")/foreseer-desktop"; export JELLIUM_DIR="$(cygpath -u "$GITHUB_WORKSPACE")/jellium-desktop"; export FORESEERR_DIR="$(cygpath -u "$GITHUB_WORKSPACE")/SeerrSuggestArr"; ./scripts/boundary-audit.sh; node -e '\''const fs=require("fs"); const a=JSON.parse(fs.readFileSync(process.env.FORESEERR_DIR + "/protocol/protocol-v1.json")); const b=JSON.parse(fs.readFileSync("protocol/protocol-v1.json")); if(JSON.stringify(a)!==JSON.stringify(b)) throw new Error("Foreseerr protocol fixture differs from desktop fixture");'\''; grep -q FORESEERR_DESKTOP_READY "$FORESEERR_DIR/server/index.ts"; grep -q "protocolVersion: 1" "$FORESEERR_DIR/server/index.ts"'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache CEF
        uses: actions/cache@v4
        with:
          path: jellium-desktop/.cache/cef
          key: cef-windows-x64-${{ hashFiles('jellium-desktop/src/Cargo.lock') }}

      - name: Fetch CEF
        working-directory: jellium-desktop
        shell: pwsh
        run: cargo xtask fetch-cef

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          install: >-
            mingw-w64-clang-x86_64-cc
            mingw-w64-clang-x86_64-clang
            mingw-w64-clang-x86_64-meson
            mingw-w64-clang-x86_64-pkgconf
            mingw-w64-clang-x86_64-ffmpeg
            mingw-w64-clang-x86_64-libplacebo
            mingw-w64-clang-x86_64-libass
            mingw-w64-clang-x86_64-vulkan-headers
            mingw-w64-clang-x86_64-vulkan-loader
            mingw-w64-clang-x86_64-shaderc
            mingw-w64-clang-x86_64-spirv-cross
            mingw-w64-clang-x86_64-llvm

      - name: Build mpv from source
        working-directory: jellium-desktop
        shell: pwsh
        run: dev\windows\build_mpv_source.ps1 -Arch x64 -Force

      - name: Determine version
        id: version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq "tag") {
            $version = $env:GITHUB_REF_NAME -replace '^v', ''
          } else {
            $manifest = Get-Content foreseer-desktop/Cargo.toml -Raw
            $match = [regex]::Match($manifest, '(?m)^version\s*=\s*"([^"]+)"')
            if (-not $match.Success) {
              throw "Could not read package version"
            }
            $version = $match.Groups[1].Value
          }
          $manifest = Get-Content foreseer-desktop/Cargo.toml -Raw
          $match = [regex]::Match($manifest, '(?m)^version\s*=\s*"([^"]+)"')
          if (-not $match.Success -or $version -ne $match.Groups[1].Value) {
            throw "Release tag and Cargo package version must match"
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      # First let Jellium stage CEF and all mpv/FFmpeg DLLs into bundle/.
      # Then build the real Foreseer executable against the same dependencies
      # and replace only Jellium's executable.
      - name: Build Windows bundle
        shell: cmd
        env:
          LIBCLANG_PATH: C:\msys64\CLANG64\bin
          MSYS_BIN: C:\msys64\CLANG64\bin
          BINDGEN_EXTRA_CLANG_ARGS: --target=x86_64-pc-windows-msvc
        run: |
          for /f "usebackq delims=" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath`) do set "VSINSTALL=%%i"
          call "%VSINSTALL%\VC\Auxiliary\Build\vcvarsall.bat" x64 || exit /b 1
          set "PATH=%PATH%;%MSYS_BIN%"

          cd /d "%GITHUB_WORKSPACE%\jellium-desktop"
          cargo xtask build --external-mpv "%GITHUB_WORKSPACE%\jellium-desktop\third_party\mpv-install" --out "%GITHUB_WORKSPACE%\bundle" || exit /b 1

          set "CEF_PATH=%GITHUB_WORKSPACE%\jellium-desktop\.cache\cef"
          set "EXTERNAL_MPV_DIR=%GITHUB_WORKSPACE%\jellium-desktop\third_party\mpv-install"
          set "CARGO_TARGET_DIR=%GITHUB_WORKSPACE%\foreseer-target"

          cargo rustc --release --manifest-path "%GITHUB_WORKSPACE%\foreseer-desktop\Cargo.toml" --bin foreseer-desktop -- -C link-arg=/SUBSYSTEM:WINDOWS -C link-arg=/ENTRY:mainCRTStartup || exit /b 1

          copy /Y "%GITHUB_WORKSPACE%\foreseer-target\release\foreseer-desktop.exe" "%GITHUB_WORKSPACE%\bundle\foreseer-desktop.exe" || exit /b 1
          del /Q "%GITHUB_WORKSPACE%\bundle\jellium-desktop.exe"

      - name: Create Windows ZIP
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $archive = "dist/ForeseerDesktop-$env:VERSION-windows-x64.zip"
          New-Item -ItemType Directory -Force dist | Out-Null

          if (-not (Test-Path bundle/foreseer-desktop.exe)) {
            throw "foreseer-desktop.exe was not staged"
          }
          if (-not (Test-Path bundle/resources/THIRD_PARTY_NOTICES.txt)) {
            throw "bundled runtime notices were not staged"
          }

          Compress-Archive -Path bundle/* -DestinationPath $archive -Force

          if (-not (Test-Path $archive)) {
            throw "Windows archive was not created"
          }

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: foreseer-desktop-windows-x64
          path: dist/ForeseerDesktop-*-windows-x64.zip
          if-no-files-found: error

  github-release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - linux-x86_64
      - windows-x64
    runs-on: ubuntu-latest

    steps:
      - name: Checkout release metadata
        uses: actions/checkout@v4
        with:
          path: foreseer-desktop
          fetch-depth: 0

      - name: Download built artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create or update release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          tag="${GITHUB_REF_NAME}"
          notes_file="$(mktemp)"

          {
            echo "Foreseer Desktop ${tag}"
            echo
            echo "## Downloads"
            echo
            echo "- Linux x86_64 AppImage"
            echo "- Windows x64 portable ZIP"
            echo
            echo "The Windows build is unsigned, so Windows may show a SmartScreen warning."
            echo
            if [[ -f foreseer-desktop/CHANGELOG.md ]]; then
              echo "## Changelog"
              echo
              awk '
                BEGIN { emit=0 }
                /^## / {
                  if (emit) exit
                  emit=1
                }
                emit { print }
              ' foreseer-desktop/CHANGELOG.md
            fi
          } > "${notes_file}"

          mapfile -t assets < <(find release-assets -type f -print | sort)
          if (( ${#assets[@]} != 2 )); then
            printf 'Expected 2 release assets, found %s:\n' "${#assets[@]}" >&2
            printf '  %s\n' "${assets[@]}" >&2
            exit 1
          fi

          if gh release view "${tag}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release edit "${tag}" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "Foreseer Desktop ${tag}" \
              --notes-file "${notes_file}"
          else
            gh release create "${tag}" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "Foreseer Desktop ${tag}" \
              --notes-file "${notes_file}" \
              --verify-tag
          fi

          gh release upload "${tag}" \
            --repo "${GITHUB_REPOSITORY}" \
            --clobber \
            "${assets[@]}"
