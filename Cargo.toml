[package]
name = "foreseer-desktop"
version = "0.2.10"
edition = "2024"
license = "GPL-2.0-only"
publish = false
description = "Native Foreseer shell using Jellium host-extension playback"
repository = "https://github.com/selmant/foreseerr-desktop"
readme = "README.md"

[lib]
name = "foreseer_desktop"
path = "src/lib.rs"

[[bin]]
name = "foreseer-desktop"
path = "src/main.rs"

[dependencies]
jfn-rust = { path = "../jellium-desktop/src/jfn_rust", features = ["host-extension"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", features = ["json"] }
base64 = "0.22"
getrandom = "0.3"
sha2 = "0.10"
directories = "6"
url = "2"
tracing = "0.1"
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = "3"
tracing-subscriber = "0.3"
