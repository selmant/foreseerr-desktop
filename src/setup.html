<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Foreseer — Connect to a server</title>
  <style>
    :root {
      --bg: #111827;
      --bg-glow: #312e81;
      --card: rgba(31, 41, 55, 0.72);
      --border: #4b5563;
      --text: #f3f4f6;
      --muted: #9ca3af;
      --indigo: #4f46e5;
      --indigo-hover: #4338ca;
      --indigo-border: #6366f1;
      --error: #fca5a5;
      --error-bg: rgba(220, 38, 38, 0.28);
      --success: #6ee7b7;
      --success-bg: rgba(16, 185, 129, 0.18);
      --info: #93c5fd;
      --info-bg: rgba(79, 70, 229, 0.18);
      --radius: 8px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      min-height: 100%;
    }

    body {
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background:
        radial-gradient(1200px 600px at 50% -10%, rgba(79, 70, 229, 0.28), transparent 60%),
        radial-gradient(800px 400px at 80% 110%, rgba(168, 85, 247, 0.12), transparent 55%),
        var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 32px 16px 40px;
    }

    .brand {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 28px;
      text-align: center;
    }

    .brand svg {
      width: 72px;
      height: 72px;
      margin-bottom: 14px;
    }

    .brand h1 {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1.1;
    }

    .brand p {
      margin-top: 8px;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.45;
      max-width: 28rem;
    }

    .card {
      width: 100%;
      max-width: 28rem;
      background: var(--card);
      border: 1px solid rgba(75, 85, 99, 0.7);
      border-radius: var(--radius);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(8px);
      padding: 2rem 2.25rem 1.75rem;
    }

    .status-box {
      margin-bottom: 1.25rem;
      padding: 0.85rem 1rem;
      border-radius: var(--radius);
      font-size: 13px;
      line-height: 1.45;
      display: none;
    }

    .status-box.error {
      display: block;
      background: var(--error-bg);
      color: var(--error);
    }

    .status-box.success {
      display: block;
      background: var(--success-bg);
      color: var(--success);
    }

    .status-box.loading {
      display: block;
      background: var(--info-bg);
      color: var(--info);
    }

    label.field-label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #d1d5db;
      margin-bottom: 8px;
    }

    input[type="url"] {
      width: 100%;
      padding: 11px 14px;
      background: rgba(17, 24, 39, 0.7);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-size: 15px;
      outline: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    input[type="url"]::placeholder {
      color: #6b7280;
    }

    input[type="url"]:focus {
      border-color: var(--indigo-border);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.25);
    }

    .hint {
      margin-top: 8px;
      margin-bottom: 1.35rem;
      color: #6b7280;
      font-size: 12px;
      line-height: 1.4;
    }

    .actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 10px 14px;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s ease, border-color 0.15s ease, opacity 0.15s ease;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-primary {
      color: #fff;
      background: rgba(79, 70, 229, 0.88);
      border: 1px solid var(--indigo-border);
    }

    .btn-primary:hover:not(:disabled) {
      background: var(--indigo-hover);
    }

    .btn-ghost {
      color: #fff;
      background: transparent;
      border: 1px solid #4b5563;
    }

    .btn-ghost:hover:not(:disabled) {
      border-color: #e5e7eb;
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 1.35rem 0 1rem;
      color: #9ca3af;
      font-size: 12px;
    }

    .divider::before,
    .divider::after {
      content: "";
      flex: 1;
      border-top: 1px solid #4b5563;
    }

    .footer {
      display: flex;
      justify-content: center;
      gap: 18px;
      margin-top: 18px;
    }

    .footer button {
      width: auto;
      padding: 0;
      border: 0;
      background: none;
      color: #6b7280;
      font-size: 12px;
      font-weight: 500;
    }

    .footer button:hover {
      color: #d1d5db;
    }
  </style>
</head>
<body>
  <header class="brand">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" aria-hidden="true">
      <path fill="url(#mark)" fill-rule="evenodd" d="M48 96C74.51 96 96 74.51 96 48S74.51 0 48 0 0 21.49 0 48s21.49 48 48 48Zm32.00-44c0 15.46-12.54 28-28 28S24 67.46 24 52c0-2.87.43-5.64 1.23-8.25C27.43 48.62 32.32 52 38 52c7.73 0 14-6.27 14-14 0-5.68-3.38-10.57-8.25-12.77 2.61-.8 5.38-1.23 8.25-1.23 15.46 0 28 12.54 28 28Z" clip-rule="evenodd"/>
      <path fill="#131928" fill-rule="evenodd" d="M80 52c0 15.46-12.54 28-28 28C36.86 80 24.53 67.99 24.02 52.98 24.01 53.32 24 53.66 24 54c0 16.57 13.43 30 30 30s30-13.43 30-30S70.57 24 54 24c-.34 0-.68.01-1.02.02C67.99 24.53 80 36.87 80 52Z" clip-rule="evenodd" opacity=".2"/>
      <path fill="url(#glint)" fill-rule="evenodd" d="M48 12C28.12 12 12 28.12 12 48c0 2.21-1.79 4-4 4s-4-1.79-4-4C4 23.7 23.7 4 48 4c2.21 0 4 1.79 4 4s-1.79 4-4 4Z" clip-rule="evenodd"/>
      <defs>
        <linearGradient id="mark" x1="48" x2="117.5" y1="0" y2="69.5" gradientUnits="userSpaceOnUse">
          <stop stop-color="#C395FC"/>
          <stop offset="1" stop-color="#4F65F5"/>
        </linearGradient>
        <linearGradient id="glint" x1="28" x2="28" y1="8" y2="48" gradientUnits="userSpaceOnUse">
          <stop stop-color="#fff" stop-opacity=".4"/>
          <stop offset="1" stop-color="#fff" stop-opacity="0"/>
        </linearGradient>
      </defs>
    </svg>
    <h1>Foreseer</h1>
    <p>Connect this app to an existing Foreseerr, or keep using the local server on this computer.</p>
  </header>

  <main class="card">
    {{RECOVERY_MESSAGE}}

    <form id="setupForm" action="#" novalidate>
      <label class="field-label" for="serverUrl">Server address</label>
      <input
        type="url"
        id="serverUrl"
        name="serverUrl"
        placeholder="https://foreseerr.example.com"
        spellcheck="false"
        autocomplete="url"
        inputmode="url"
        required
        autofocus
      >
      <p class="hint">Use https:// or http://. Add a port if it is not 443 or 80.</p>

      <div id="statusBox" class="status-box" role="status"></div>

      <div class="actions">
        <button type="submit" class="btn-primary" id="saveBtn">Connect</button>
        <button type="button" class="btn-ghost" id="testBtn">Test connection</button>
      </div>
    </form>

    <div class="divider">or</div>

    <button type="button" class="btn-ghost" id="standaloneBtn">{{STANDALONE_ACTION_LABEL}}</button>
  </main>

  <nav class="footer">
    <button type="button" id="logsBtn">Open logs</button>
    <button type="button" id="quitBtn">Quit</button>
  </nav>

  <script>
    {{SETUP_EVENT_JS}}

    function generateId() {
      return Math.random().toString(36).substring(2, 15);
    }

    function nativeCall(action, url, allowHttp) {
      return new Promise((resolve, reject) => {
        const reqId = generateId();

        const listener = (e) => {
          const detail = window.foreseerSetupProtocolV1.parseEvent(e.detail, reqId);
          if (detail) {
            window.removeEventListener('foreseer:native-event', listener);
            if (detail.type === 'error') {
              reject(new Error(detail.message || detail.errorCode || 'Action failed'));
            } else {
              resolve(detail);
            }
          }
        };
        window.addEventListener('foreseer:native-event', listener);

        try {
          const host = window.foreseerNative;
          if (!host || typeof host.send !== 'function') {
            throw new Error('Native integration missing');
          }
          const ok = host.send({
            id: reqId,
            type: action === 'test' ? 'setup.check' : action === 'standalone' ? 'setup.standalone' : action === 'logs' ? 'runtime.open-logs' : action === 'quit' ? 'app.quit' : 'setup.save',
            url,
            allowHttp: !!allowHttp,
          });
          if (!ok) {
            throw new Error('Native call rejected');
          }
        } catch (err) {
          window.removeEventListener('foreseer:native-event', listener);
          reject(new Error(err.message || 'Native integration missing'));
        }
      });
    }

    function showStatus(message, kind) {
      const statusBox = document.getElementById('statusBox');
      statusBox.className = 'status-box ' + kind;
      statusBox.textContent = message;
    }

    function formValues() {
      const url = document.getElementById('serverUrl').value.trim();
      return {
        url,
        allowHttp: /^http:/i.test(url),
      };
    }

    document.getElementById('standaloneBtn').addEventListener('click', async () => {
      try {
        await nativeCall('standalone', '', false);
        showStatus('Standalone mode will start after restart.', 'success');
      } catch (err) {
        showStatus(err.message, 'error');
      }
    });

    document.getElementById('logsBtn').addEventListener('click', async () => {
      try {
        await nativeCall('logs', '', false);
        showStatus('Opened standalone logs.', 'success');
      } catch (err) {
        showStatus(err.message, 'error');
      }
    });

    document.getElementById('quitBtn').addEventListener('click', () => {
      nativeCall('quit', '', false).catch(() => {
        showStatus('Could not quit Foreseer.', 'error');
      });
    });

    document.getElementById('testBtn').addEventListener('click', async () => {
      const { url, allowHttp } = formValues();
      const testBtn = document.getElementById('testBtn');
      if (!url) {
        showStatus('Enter a server address first.', 'error');
        return;
      }
      showStatus('Testing connection…', 'loading');
      testBtn.disabled = true;
      try {
        const result = await nativeCall('test', url, allowHttp);
        showStatus('Reachable (HTTP ' + result.status + ')', 'success');
      } catch (err) {
        showStatus(err.message, 'error');
      } finally {
        testBtn.disabled = false;
      }
    });

    document.getElementById('setupForm').addEventListener('submit', async (event) => {
      event.preventDefault();
      const { url, allowHttp } = formValues();
      const saveBtn = document.getElementById('saveBtn');
      if (!url) {
        showStatus('Enter a server address first.', 'error');
        return;
      }
      showStatus('Saving configuration…', 'loading');
      saveBtn.disabled = true;
      try {
        await nativeCall('save', url, allowHttp);
        showStatus('Saved. Opening Foreseer…', 'success');
      } catch (err) {
        showStatus(err.message, 'error');
        saveBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
